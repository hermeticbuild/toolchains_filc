name: Consumer tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  archive:
    name: Archive / ${{ matrix.cpu }} / ${{ matrix.libc }} / Bazel ${{ matrix.bazel }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        bazel: ['9.x']
        cpu: [x86_64, aarch64]
        libc: [musl, glibc]
        include:
          - cpu: x86_64
            runner: ubuntu-24.04
          - cpu: aarch64
            runner: ubuntu-24.04-arm
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-version: '1.30.0'
      - name: Test the extracted release archive as a dependency
        run: .github/workflows/check_archive.sh --config=${{ matrix.libc }}_${{ matrix.cpu }}
